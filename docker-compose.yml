services:
  postgres:
    image: postgres:16-alpine
    container_name: pathdle-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pathdle
      POSTGRES_PASSWORD: pathdle
      POSTGRES_DB: pathdle
    volumes:
      - pathdle_pgdata:/var/lib/postgresql/data
      - ./infra/sql/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infra/sql/migrations/002_hint_edges.sql:/docker-entrypoint-initdb.d/02_hint_edges.sql:ro
      - ./infra/sql/seed/001_seed_puzzle.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathdle -d pathdle"]
      interval: 3s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: pathdle-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/pathdle-neo4j
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - pathdle_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pathdle_pgdata:
  pathdle_neo4j_data:
